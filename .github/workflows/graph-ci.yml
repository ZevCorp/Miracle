name: Graph · CI

# Graph es el servicio del que dependen los cuatro clientes, y hasta el 2026-09-28 no tenía ninguna
# compuerta automática: sus intentos de CI (best-practices, frontend-build-step, chore/portero) se
# quedaron en ramas sin mergear. Este workflow corre `npm test`, que es el contrato de Graph
# (scripts/contrato.js): sus verificaciones offline con dobles de Supabase y del LLM, cruzadas con
# las promesas de docs/specs/. Sale en rojo si una promesa no se cumple, y también si un verify no
# es juez de ninguna fila.
#
# Node 24, la versión del proyecto en Vercel. La promesa 22 necesita un Postgres real y aquí no lo
# hay: el veredicto la nombra como sin juzgar, no la cuenta como cumplida.

on:
  # En un PR lo llama la compuerta (monorepo.yml) cuando el PR toca Graph.
  workflow_call:
  push:
    branches: [main]
    paths: ['services/graph/**', '.github/workflows/graph-ci.yml', '.github/workflows/vercel-desplegar.yml']
  # Redesplegar a mano (por ejemplo, tras cambiar una variable en Vercel): Actions → Graph · CI → Run.
  workflow_dispatch:

defaults:
  run:
    working-directory: services/graph

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/graph/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # Solo en main, y solo si los tests pasaron: lo que llega a producción es lo que pasó el CI.
  desplegar:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/vercel-desplegar.yml
    with:
      proyecto: graph
      carpeta: services/graph
      humo: https://miracle-graph.vercel.app/api/health
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
