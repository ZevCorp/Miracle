name: Mac · build

# Contratos, app empaquetada y binario universal (arm64 + x86_64) de Ü para Mac. Venía como
# mac-native.yml; desde el 2026-09-28 la Mac vive en apps/mac/ y todo corre desde ahí.
on:
  push:
    branches: ['main']
    paths: ['apps/mac/**', '.github/workflows/mac-build.yml']
  pull_request:
    paths: ['apps/mac/**', '.github/workflows/mac-build.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: apps/mac
jobs:
  build:
    # macos-15 y no 14: el Xcode por defecto de macos-14 (Swift 5.10) da error en «[weak self]» dentro
    # de Task { @MainActor }, que los compiladores nuevos aceptan. Falló así en los tres últimos
    # pushes de codex/mac-from-scratch (24, 25 y 27-sep).
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Contracts and packaged app
        run: ./build.sh release
      - name: Cross-compile Apple Silicon and Intel
        run: |
          swift build -c release --product U --triple arm64-apple-macosx14.0 --scratch-path .build-arm
          swift build -c release --product U --triple x86_64-apple-macosx14.0 --scratch-path .build-intel
          arm_bin=$(swift build -c release --triple arm64-apple-macosx14.0 --scratch-path .build-arm --show-bin-path)
          intel_bin=$(swift build -c release --triple x86_64-apple-macosx14.0 --scratch-path .build-intel --show-bin-path)
          lipo -create "$arm_bin/U" "$intel_bin/U" -output .artifacts/U.app/Contents/MacOS/U
          codesign --force --sign - .artifacts/U.app
          codesign --verify --deep --strict .artifacts/U.app
          ditto -c -k --keepParent .artifacts/U.app .artifacts/U-Mac.zip
      # upload-artifact no mira working-directory: la ruta es desde la raíz del repo.
      - uses: actions/upload-artifact@v4
        with:
          name: U-Mac-universal-development
          path: apps/mac/.artifacts/U-Mac.zip
          retention-days: 14
