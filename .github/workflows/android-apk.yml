name: Android · APK

# Juzga el contrato de Android y compila el APK release (firmado con la clave compartida del repo),
# que publica como artefacto descargable. Se dispara a mano (workflow_dispatch), en cada push a main
# que toque apps/android/, y en cada PR que lo toque (lo llama la compuerta, monorepo.yml).
#
# Venía de ZevCorp/Android (.github/workflows/build-apk.yml) y entró al monorepo el 2026-09-28. En
# el repo propio el portero local ya compilaba y juzgaba antes de empujar, pero en el monorepo quien
# toca apps/android/ puede no tener el SDK: aquí es donde se ve antes de main, no después. El
# contrato (scripts/contrato.sh) corre aquí desde el 2026-09-30; hasta entonces el CI solo compilaba.
#
# La OpenAI API key se hornea desde el secreto OPENAI_KEY del repo, nunca desde git (opcional: lo que
# falte se escribe dentro de la app, en el panel de Desarrollador). OJO: el repo es público y los
# artefactos también; un APK con claves horneadas las publica.
#
# Las de Gemini y Deepgram ya NO se hornean (2026-10-01, a pedido del dueño; promesa 45 de la raíz). La
# app las toma de lo que el usuario escriba o de la config que distribuye el backend (RemoteConfig), y
# sin ninguna el dictado cae al reconocedor del sistema. Los secretos GEMINI_KEY y DEEPGRAM_KEY quedan
# sin uso: se borran en Settings → Secrets and variables → Actions, y como ya viajaron en APKs
# publicados, se rotan en Google AI Studio y en Deepgram.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/android/**', '!apps/android/**/*.md', '.github/workflows/android-apk.yml']
  # En un PR lo llama la compuerta (monorepo.yml) cuando el PR toca Android.
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # Por defecto instala «tools platform-tools», y «tools» ya no existe en las cmdline-tools 16.0
        # del runner: el APK fallaba ahí, antes de compilar nada, en los 5 runs de ZevCorp/Android
        # desde el 2026-09-15. Gradle baja la plataforma y las build-tools que le hagan falta.
        with:
          packages: platform-tools

      - name: Bake API key de OpenAI (desde secrets, fuera de git)
        run: |
          {
            echo "openaiKey=${{ secrets.OPENAI_KEY }}"
          } > apikey.properties

      # El mismo juez que corre el portero local. Su última línea es el veredicto.
      - name: El contrato
        run: ./scripts/contrato.sh

      # Aunque el contrato esté roto: que el APK compile o no es otra pregunta, y conviene saber las dos.
      - name: Build release APK
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # upload-artifact no mira working-directory: la ruta es desde la raíz del repo.
      - name: Upload APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: miracle-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
